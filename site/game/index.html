<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try to stop them</title>
<style>
:root { --bg: #ecebe7; --ink: #1d1c17; --muted: #55534b; --blue: #2456d6; --red: #d8361f; --surface: #dfddd7; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, sans-serif; padding: 24px clamp(16px, 4vw, 48px) 60px; }
h1 { font-size: clamp(2rem, 1.4rem + 2.5vw, 3.2rem); line-height: 1.05; letter-spacing: -0.02em; }
.lead { margin-top: 10px; max-width: 62ch; font-size: 1.1rem; }
.game { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; margin-top: 28px; align-items: start; }
.controls { background: var(--surface); padding: 22px; display: grid; gap: 16px; }
label { display: grid; gap: 6px; font-weight: 600; }
select, input[type=range] { width: 100%; font: inherit; }
select { padding: 8px; background: #fff; border: 0; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.hint { font-weight: 400; color: var(--muted); font-size: .92rem; }
button { font: 600 1rem system-ui; background: var(--blue); color: #fff; border: 0; padding: 14px 20px; border-radius: 999px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.stage { display: grid; gap: 14px; }
#board { width: 100%; aspect-ratio: 1.35; background: #f6f5f2; display: block; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.charts figure { background: #f6f5f2; padding: 10px 12px; }
.charts canvas { width: 100%; height: 110px; display: block; }
figcaption { font-size: .9rem; color: var(--muted); margin-top: 4px; }
#gen { font-weight: 600; }
#score { background: var(--ink); color: var(--bg); padding: 18px 20px; font-size: 1.05rem; }
#score b { font-size: 2rem; display: block; line-height: 1.1; }
#score span { display: block; margin-top: 6px; color: #cfcdc5; }
@media (max-width: 860px) { .game { grid-template-columns: 1fr; } .charts { grid-template-columns: 1fr; } #board { aspect-ratio: 1; } }
</style>
</head>
<body>
<h1>Try to stop them</h1>
<p class="lead">Six AI agents share a codebase. Each one keeps any change that helps itself, and shortcuts hurt everyone. Pick a rule, press go, and watch them evolve against it. These are the real learning agents from the research, running in your browser.</p>

<div class="game">
  <form class="controls" onsubmit="return false">
    <label>Your rule
      <select id="rule">
        <option value="none">Do nothing</option>
        <option value="conscience">Give them a conscience</option>
        <option value="visible" selected>Tax the coupling you can see</option>
        <option value="damage">Tax the damage they cause others</option>
      </select>
    </label>
    <label id="levelRow">How hard <output id="levelOut"></output>
      <input id="level" type="range">
    </label>
    <label>How unequal are the modules?
      <select id="skew">
        <option value="0">All equally exposed</option>
        <option value="0.75">Some take more incidents</option>
        <option value="1.5">One module takes most of them</option>
      </select>
    </label>
    <label class="check"><input id="honest" type="checkbox" checked> Agents start honest</label>
    <button id="run" type="button">Go: 40 generations</button>
    <label>Speed <input id="speed" type="range" min="2" max="20" value="6"><span class="hint">generations per second</span></label>
    <label class="check"><input id="xray" type="checkbox"> X-ray: show hidden coupling</label>
  </form>

  <div class="stage">
    <p id="gen">Press go to start.</p>
    <canvas id="board" aria-label="Six modules joined by coupling wires; faces show each agent's state"></canvas>
    <div class="charts">
      <figure><canvas id="cost"></canvas><figcaption>System cost (lower is better). Dashed: doing nothing (black) and best possible (blue).</figcaption></figure>
      <figure><canvas id="hid"></canvas><figcaption>Share of coupling that is hidden.</figcaption></figure>
    </div>
    <p id="score" hidden></p>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>

[project]
name = "evortgs"
version = "0.1.0"
description = "Acceptance gates versus prices for co-evolving agents, in a payment network and a shared codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evortgs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
